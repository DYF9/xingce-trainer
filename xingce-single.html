<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="资料分析">
<meta name="description" content="行测资料分析专项训练：计算能力（截位直除、增长率、比重、平均数、特征分数）与找数能力（材料定位、表格定位），手机与电脑双端、离线可用。">
<!-- 单文件版：双击即可运行，可直接发到手机 -->
<title>行测资料分析训练</title>
<style>
/* ===== XC Sprint 行测资料分析训练 ===== */
:root{
  --bg:#0d1117; --bg2:#141b26; --card:#182130; --card2:#1f2a3c; --line:#27313f;
  --txt:#e9eef7; --dim:#93a3ba; --dim2:#6b7c94;
  --acc:#4c8dff; --acc2:#7aa9ff; --ok:#2fd08b; --bad:#ff6470; --warn:#ffb02e;
  --r:14px; --shadow:0 6px 24px rgba(0,0,0,.28);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
html[data-theme="light"]{
  --bg:#f3f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#f0f4fa; --line:#dbe3ee;
  --txt:#131a24; --dim:#5c6b80; --dim2:#8794a6; --shadow:0 6px 20px rgba(20,40,80,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + var(--safe-b)); overscroll-behavior-y:none;
}
#app{max-width:860px;margin:0 auto;padding:0 14px 8px}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--acc)}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 2px 10px;margin:0 -14px 12px;padding-left:14px;padding-right:14px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.topbar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;
  background:var(--card);border:1px solid var(--line);flex:none;font-size:15px}
.icon-btn:active{transform:scale(.94)}
.timer{font-variant-numeric:tabular-nums;font-weight:650;font-size:14px;padding:5px 10px;
  border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--dim)}
.timer.hot{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}

/* ---------- 首页 ---------- */
.hero{padding:10px 4px 18px}
.hero .kicker{font-size:12px;letter-spacing:2px;color:var(--acc);font-weight:700}
.hero h2{font-size:26px;line-height:1.28;margin:8px 0 6px;font-weight:750}
.hero p{margin:0;color:var(--dim);font-size:14px}
.grid{display:grid;gap:12px}
.grid.g2{grid-template-columns:1fr 1fr}
@media(max-width:520px){.grid.g2{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.mode{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.mode:active{transform:scale(.985)}
.mode .ico{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 26%,var(--card2)),var(--card2))}
.mode h3{margin:0 0 3px;font-size:16px;font-weight:680}
.mode p{margin:0;font-size:13px;color:var(--dim)}
.mode .tagline{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--dim);
  border:1px solid var(--line);white-space:nowrap}
.chip.on{background:color-mix(in srgb,var(--acc) 18%,var(--card2));color:var(--acc2);
  border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}

/* ---------- 段控 ---------- */
.seg{display:flex;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--dim);font-weight:600}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.label{font-size:12px;color:var(--dim2);letter-spacing:.6px;font-weight:600}
.section-title{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:1px;margin:20px 2px 10px}

/* ---------- 题目 ---------- */
.progress{height:5px;border-radius:99px;background:var(--card2);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));
  border-radius:99px;transition:width .28s ease}
.stem{font-size:17px;line-height:1.65;margin:4px 0 14px}
.stem b{color:var(--acc2);font-weight:700}
.meta-line{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

.opts{display:grid;gap:9px;margin-top:6px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:13px 14px;border-radius:12px;
  background:var(--card);border:1.5px solid var(--line);font-size:16px;font-variant-numeric:tabular-nums;
  transition:border-color .15s,background .15s}
.opt .k{width:22px;height:22px;flex:none;border-radius:7px;background:var(--card2);color:var(--dim);
  display:grid;place-items:center;font-size:12px;font-weight:700}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.opt.sel .k{background:var(--acc);color:#fff}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.correct .k{background:var(--ok);color:#04231a}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt.wrong .k{background:var(--bad);color:#2a0006}
.opt:disabled{cursor:default}

/* ---------- 材料 ---------- */
.material{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:14px}
.material .mtitle{font-size:13.5px;font-weight:700;color:var(--acc2);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.material p{margin:0 0 9px;font-size:15px;line-height:1.85;color:var(--txt);text-align:justify}
.material p:last-child{margin-bottom:0}
.num{display:inline;white-space:nowrap;padding:1.5px 4px;margin:0 1px;border-radius:5px;border-bottom:1.5px dashed var(--dim2);
  cursor:pointer;transition:background .12s,color .12s;font-variant-numeric:tabular-nums}
.num:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.num.sel{background:color-mix(in srgb,var(--acc) 26%,transparent);border-bottom-color:var(--acc)}
.num.hit{background:color-mix(in srgb,var(--ok) 26%,transparent);border-bottom-color:var(--ok)}
.num.miss{background:color-mix(in srgb,var(--bad) 24%,transparent);border-bottom-color:var(--bad)}
.num.reveal{background:color-mix(in srgb,var(--ok) 16%,transparent);border-bottom-color:var(--ok)}

/* ---------- 表格 ---------- */
.twrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.mat{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.mat th,table.mat td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right}
table.mat th:first-child,table.mat td:first-child{text-align:left;font-weight:600;color:var(--dim);white-space:normal;min-width:110px}
table.mat thead th{color:var(--dim2);font-size:12px;font-weight:700;position:sticky;top:0;background:var(--card)}
table.mat td.cell{cursor:pointer;border-radius:6px}
table.mat td.cell:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}
table.mat td.cell.sel{background:color-mix(in srgb,var(--acc) 26%,transparent);box-shadow:inset 0 0 0 1.5px var(--acc)}
table.mat td.cell.hit{background:color-mix(in srgb,var(--ok) 24%,transparent);box-shadow:inset 0 0 0 1.5px var(--ok)}
table.mat td.cell.miss{background:color-mix(in srgb,var(--bad) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--bad)}
table.mat td.cell.reveal{box-shadow:inset 0 0 0 1.5px var(--ok)}

/* ---------- 反馈 ---------- */
.feedback{margin-top:14px;border-radius:var(--r);padding:14px;border:1px solid var(--line);background:var(--card);
  animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.feedback.good{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.feedback.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.feedback .head{display:flex;align-items:center;gap:8px;font-weight:750;font-size:15px;margin-bottom:6px}
.feedback.good .head{color:var(--ok)}
.feedback.bad .head{color:var(--bad)}
.feedback .body{font-size:14px;color:var(--dim);line-height:1.7}
.feedback .body b{color:var(--txt);font-weight:650}
.tipbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--card2);font-size:13px;
  color:var(--dim);border-left:3px solid var(--acc)}
.tipbox b{color:var(--acc2)}

/* ---------- 底部操作条 ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + var(--safe-b));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.actionbar .inner{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{padding:13px 18px;border-radius:12px;font-weight:700;font-size:15.5px;background:var(--card2);
  border:1px solid var(--line);color:var(--txt);flex:1;text-align:center;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(160deg,var(--acc),#3a72e0);border-color:transparent;color:#fff}
.btn.ghost{flex:none;width:auto;padding:13px 16px;color:var(--dim)}
.btn[disabled]{opacity:.45}
.btn.small{flex:none;padding:9px 14px;font-size:13.5px;border-radius:10px}

/* ---------- 结果页 ---------- */
.score{display:flex;gap:14px;align-items:baseline;margin:6px 0 4px}
.score .big{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.score .unit{font-size:14px;color:var(--dim)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card2);border-radius:12px;padding:11px 12px;border:1px solid var(--line)}
.stat .v{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--dim2);letter-spacing:.5px;margin-top:2px}
.review{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px}
.rv .q{color:var(--dim);font-size:13px;margin-bottom:4px}
.rv .ans{font-size:13px}
.rv .ans .y{color:var(--ok)} .rv .ans .n{color:var(--bad)}

/* 条形图 */
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 35%,transparent));min-height:3px}
.bars .b span{font-size:10.5px;color:var(--dim2)}

/* 弱项条 */
.weak{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.weak .w{display:flex;align-items:center;gap:10px;font-size:13.5px}
.weak .w .n{width:86px;flex:none;color:var(--dim)}
.weak .w .track{flex:1;height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.weak .w .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--warn))}
.weak .w .p{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}

/* 手册 */
.guide{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.guide summary{padding:13px 15px;font-weight:680;font-size:15px;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";color:var(--dim);font-weight:400;font-size:18px}
.guide[open] summary::after{content:"−"}
.guide .gbody{padding:0 15px 14px;font-size:14px;color:var(--dim);white-space:pre-wrap;line-height:1.85}
.guide[open] summary{border-bottom:1px solid var(--line);margin-bottom:11px}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:31;display:flex;
  background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
.tabinner{display:flex;flex:1;width:100%;max-width:860px;margin:0 auto}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  font-size:10.5px;color:var(--dim2);font-weight:600;max-width:180px}
.tabbar button .ti{font-size:18px;line-height:1}
.tabbar button.on{color:var(--acc2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));z-index:60;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:99px;
  font-size:13.5px;box-shadow:var(--shadow);animation:pop .18s ease}
.hidden{display:none!important}
.muted{color:var(--dim)}
.center{text-align:center}
.sp6{height:6px}.sp10{height:10px}.sp16{height:16px}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--dim2);background:var(--card2)}
@media(min-width:600px){ body{font-size:16.5px} .stem{font-size:18px} }

</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">请开启 JavaScript 后使用本训练程序。</p></noscript>
<script>
/* ============================================================
 * XC Sprint · 行测资料分析训练 · 题库生成器（纯逻辑，可在 Node 中测试）
 * 无 DOM 依赖；浏览器挂到 window.XCGen
 * ============================================================ */
(function (global) {
'use strict';

/* ---------------- 随机与格式 ---------------- */
let RAND = Math.random;
function setRandom(fn){ RAND = (typeof fn === 'function') ? fn : Math.random; }
function ri(a, b){ return a + Math.floor(RAND() * (b - a + 1)); }
function rf(a, b){ return a + RAND() * (b - a); }
function pick(arr){ return arr[Math.floor(RAND() * arr.length)]; }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(RAND() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function round(x, d){
  d = (d == null) ? 1 : d;
  const p = Math.pow(10, d);
  const v = Math.round((x + (x >= 0 ? 1 : -1) * 1e-9) * p) / p;
  return v;
}
function fx(x, d){ d = (d == null) ? 1 : d; return round(x, d).toFixed(d); }
function pct(x, d){ d = (d == null) ? 1 : d; let s = fx(x, d); if (s === '-0.0') s = '0.0'; return s + '%'; }

/** 三位有效数字字符串 */
function sig3(x){
  const ax = Math.abs(x);
  if (ax === 0 || !isFinite(ax)) return '0';
  const e = Math.floor(Math.log10(ax));
  const d = 2 - e;
  if (d >= 0) return round(x, d).toFixed(d);
  const m = Math.pow(10, -d);
  return String(round(x / m, 0) * m);
}

/** 生成 count 个互不相同的选项（含唯一正确答案），返回 {options, answer} */
function buildOptions(truth, fmt, altValues, count){
  count = count || 4;
  const key = fmt(truth);
  const list = [key];
  const seen = new Set(list);
  const push = (v) => {
    const s = fmt(v);
    if (!seen.has(s) && s !== key){ seen.add(s); list.push(s); return true; }
    return false;
  };
  for (let i = 0; i < altValues.length && list.length < count; i++) push(altValues[i]);
  let guard = 0;
  const span = Math.max(Math.abs(truth), 1);
  while (list.length < count && guard++ < 300){
    const dir = RAND() < 0.5 ? -1 : 1;
    push(truth + dir * span * (0.01 + RAND() * 0.15) * (1 + guard * 0.15));
  }
  while (list.length < count){ push(truth + list.length * 1.7); }
  const sh = shuffle(list);
  return { options: sh, answer: sh.indexOf(key) };
}

let SEQ = 0;
function qid(){ SEQ += 1; return 'q' + SEQ; }

/* ---------------- 名称与文本素材 ---------------- */
const UNITS_MONEY = ['亿元', '万元', '元'];
const TIPS = {
  div: '截位直除：分母保留三位有效数字、分子取整，直接做除法；选项首两位不同时只算前两位即可。',
  growth: '增长类：① 求增长率＝(现期－基期)÷基期；② 求基期＝现期÷(1＋增长率)，用截位直除；③ 求增长量＝现期×r÷(1＋r)，可先把 r 化成分数。',
  weight: '比重：现期比重＝部分÷整体；比重变化看增速——部分增速＞整体增速则比重上升，反之下降，幅度≈现期比重×(a−b)÷(1＋a)，单位是“个百分点”。',
  avg: '平均数增长率＝(1＋总量增速)÷(1＋份数增速)－1，与平均数的绝对值无关，只与两个增速有关。',
  frac: '特征分数：1/6=16.7%、1/7=14.3%、1/8=12.5%、1/9=11.1%、1/11=9.1%、1/12=8.3%、1/13=7.7%、1/14=7.1%、1/15=6.7%、1/16=6.3%、1/17=5.9%、1/18=5.6%、1/19=5.3%。',
  mult: '速算乘法：拆成整十数＋零头（47×83＝47×80＋47×3）；接近 100 的平方用 (100±k)²＝10000±200k＋k²。',
  compare: '分数比较：先看直除的首位；接近时用差分法——两分数分子分母分别作差，用差分数与其中较小者比较，差分数大则被减数大。',
  locate: '找数三步：① 圈出题干的时间（现期还是基期）；② 圈出主体名称（多个相似名称要逐字比对）；③ 圈出考点（多少、增速、比重、平均）。对应不上就先定位再算。',
  table: '表格找数：先看表头单位和年份，再横向找指标、纵向找年份，交叉点才是你要的数；注意“其中”“累计”“同比”这类限定词。'
};
const TAG_NAME = {
  div: '截位直除', growth: '增长率与增长量', weight: '比重', avg: '平均数',
  frac: '特征分数', mult: '速算乘法', compare: '分数比较',
  locate: '材料找数', table: '表格找数'
};
const CALC_TAGS = ['div', 'growth', 'weight', 'avg', 'frac', 'mult', 'compare'];

/* ============================================================
 * 计算类题目
 * ============================================================ */

/* 1. 截位直除 */
function makeDiv(diff){
  const lo = diff >= 3 ? 1000 : 200;
  const hi = diff >= 3 ? 9999 : 9999;
  const a = round(rf(lo, hi), 1);
  const b = round(rf(lo, hi), 1);
  const truth = a / b;
  const fmt = sig3;
  const alts = [truth * 1.03, truth * 0.97, truth * 1.07, truth * 0.93, truth / 10, truth * 10];
  const o = buildOptions(truth, fmt, alts, 4);
  return {
    id: qid(), tag: 'div', kind: 'calc', diff: diff,
    stem: '计算：' + fx(a, 1) + ' ÷ ' + fx(b, 1) + ' ≈ ？（保留三位有效数字）',
    options: o.options, answer: o.answer,
    tip: TIPS.div,
    explain: '分母取三位有效数字 ' + sig3(b) + '、分子取 ' + sig3(a) + ' 直除，得 ' + fmt(truth) + '。',
    targetSec: diff >= 3 ? 28 : 20,
    meta: { a: a, b: b, truth: truth }
  };
}

/* 2. 增长类 */
function makeGrowth(diff){
  const kind = pick(['rate', 'rate', 'base', 'delta', 'current']);
  const A = round(rf(diff >= 3 ? 300 : 500, diff >= 3 ? 9999 : 6000), 1);
  let r = round(rf(2, diff >= 3 ? 26 : 16), 1);
  if (RAND() < 0.13) r = -r;
  const B = round(A * (1 + r / 100), 2);
  const y0 = pick(['2018', '2019', '2020', '2021', '2022']);
  const y1 = String(Number(y0) + 1);
  const name = pick(['地区生产总值', '规模以上工业增加值', '固定资产投资', '社会消费品零售总额', '营业收入', '利润总额', '出口额', '财政收入']);

  if (kind === 'rate'){
    const truth = (B - A) / A * 100;
    const o = buildOptions(truth, v => pct(v, 1),
      [truth + 0.6, truth - 0.5, truth + 1.2, truth - 1.1, -truth, truth * 1.15], 4);
    return {
      id: qid(), tag: 'growth', kind: 'calc', diff: diff,
      stem: '某地' + y0 + '年' + name + '为 ' + fx(A, 1) + ' 亿元，' + y1 + '年为 ' + fx(B, 2) + ' 亿元。求' + y1 + '年该指标同比增长率。',
      options: o.options, answer: o.answer, tip: TIPS.growth,
      explain: '增长率＝(现期－基期)÷基期＝(' + fx(B, 2) + '－' + fx(A, 1) + ')÷' + fx(A, 1) + '≈ ' + pct(truth, 1) + '。',
      targetSec: 35, meta: { kind: 'rate', A: A, B: B, truth: truth }
    };
  }
  if (kind === 'base'){
    const truth = B / (1 + r / 100);
    const o = buildOptions(truth, v => fx(v, 1),
      [truth * 1.02, truth * 0.974, truth * 1.035, truth * 0.96, B, B * 0.98], 4);
    return {
      id: qid(), tag: 'growth', kind: 'calc', diff: diff,
      stem: '某地' + y1 + '年' + name + '为 ' + fx(B, 2) + ' 亿元，同比增长 ' + pct(r, 1) + '。求' + y0 + '年该指标的值。',
      options: o.options, answer: o.answer, tip: TIPS.growth,
      explain: '基期＝现期÷(1＋增长率)＝' + fx(B, 2) + '÷' + fx(1 + r / 100, 3) + '≈ ' + fx(truth, 1) + ' 亿元。',
      targetSec: 40, meta: { kind: 'base', A: A, B: B, r: r, truth: truth }
    };
  }
  if (kind === 'delta'){
    const truth = B - A;
    const o = buildOptions(truth, v => fx(v, 2),
      [truth * 1.04, truth * 0.95, A * r / 100 * 1.15, truth * 1.1, Math.abs(B - A) * 0.9 + 1], 4);
    return {
      id: qid(), tag: 'growth', kind: 'calc', diff: diff,
      stem: '某地' + y1 + '年' + name + '为 ' + fx(B, 2) + ' 亿元，' + y0 + '年为 ' + fx(A, 1) + ' 亿元。求' + y1 + '年比' + y0 + '年增加多少亿元？',
      options: o.options, answer: o.answer, tip: TIPS.growth,
      explain: '增长量＝现期－基期＝' + fx(B, 2) + '－' + fx(A, 1) + '＝' + fx(truth, 2) + ' 亿元。',
      targetSec: 30, meta: { kind: 'delta', A: A, B: B, truth: truth }
    };
  }
  const truth = B;
  const o = buildOptions(truth, v => fx(v, 2),
    [A * (1 + r / 100 * 1.2), A * (1 - r / 100), truth * 1.03, truth * 0.97, A], 4);
  return {
    id: qid(), tag: 'growth', kind: 'calc', diff: diff,
    stem: '某地' + y0 + '年' + name + '为 ' + fx(A, 1) + ' 亿元，' + y1 + '年同比增长 ' + pct(r, 1) + '。求' + y1 + '年该指标的值。',
    options: o.options, answer: o.answer, tip: TIPS.growth,
    explain: '现期＝基期×(1＋增长率)＝' + fx(A, 1) + '×' + fx(1 + r / 100, 3) + '≈ ' + fx(truth, 2) + ' 亿元。',
    targetSec: 30, meta: { kind: 'current', A: A, B: B, r: r, truth: truth }
  };
}

/* 3. 比重 */
function makeWeight(diff){
  const variant = pick(['share', 'share', 'shift']);
  const name = pick(['第三产业', '高新技术产业', '战略性新兴产业', '民营经济', '农业']);
  const wholeName = pick(['地区生产总值', '全部营业收入', '全部投资额', '总销售额']);
  if (variant === 'share'){
    const W = round(rf(2000, 9000), 1);
    const P = round(W * rf(0.15, 0.75), 1);
    const truth = P / W * 100;
    const o = buildOptions(truth, v => pct(v, 1),
      [truth + 0.4, truth - 0.35, truth + 0.9, truth - 0.8, truth * 1.1, 100 - truth], 4);
    return {
      id: qid(), tag: 'weight', kind: 'calc', diff: diff,
      stem: '2023年某地' + wholeName + '为 ' + fx(W, 1) + ' 亿元，其中' + name + '为 ' + fx(P, 1) + ' 亿元。求' + name + '占' + wholeName + '的比重。',
      options: o.options, answer: o.answer, tip: TIPS.weight,
      explain: '比重＝部分÷整体＝' + fx(P, 1) + '÷' + fx(W, 1) + '≈ ' + pct(truth, 1) + '。',
      targetSec: 30, meta: { kind: 'share', P: P, W: W, truth: truth }
    };
  }
  let P1, W1, a, b, truth, guard0 = 0;
  do {
    P1 = round(rf(200, 3000), 1);
    W1 = round(P1 / rf(0.2, 0.7), 1);
    a = round(rf(4, 22), 1);
    b = round(rf(2, 11), 1);
    const P0 = P1 / (1 + a / 100), W0 = W1 / (1 + b / 100);
    truth = (P1 / W1 - P0 / W0) * 100;
  } while (Math.abs(truth) < 0.65 && guard0++ < 300);
  const dir = truth >= 0 ? '上升' : '下降';
  const abs = Math.abs(truth);
  const fmt = v => (v >= 0 ? '上升' : '下降') + fx(Math.abs(v), 1) + '个百分点';
  const alts = [
    Math.sign(truth) * (abs * 0.55), -truth, Math.sign(truth) * (abs * 1.6),
    Math.sign(truth) * (abs + 0.5), Math.sign(truth) * Math.abs(a - b)
  ];
  const key = fmt(truth);
  const list = [key];
  for (const v of alts){ const s = fmt(v); if (s !== key && list.indexOf(s) < 0) list.push(s); }
  let guard = 0;
  while (list.length < 4 && guard++ < 100){ const s = fmt(Math.sign(truth) * (abs + guard * 0.3)); if (list.indexOf(s) < 0) list.push(s); }
  const sh = shuffle(list.slice(0, 4));
  return {
    id: qid(), tag: 'weight', kind: 'calc', diff: diff,
    stem: '2023年某地' + name + '为 ' + fx(P1, 1) + ' 亿元，同比增长 ' + pct(a, 1) + '；' + wholeName + '为 ' + fx(W1, 1) + ' 亿元，同比增长 ' + pct(b, 1) + '。求2023年' + name + '占' + wholeName + '的比重比上年同期如何变化？',
    options: sh, answer: sh.indexOf(key), tip: TIPS.weight,
    explain: '部分增速 ' + pct(a, 1) + ' ' + (a > b ? '＞' : '＜') + ' 整体增速 ' + pct(b, 1) + '，比重' + dir + '；幅度≈现期比重×(' + fx(a, 1) + '－' + fx(b, 1) + ')÷(1＋' + fx(a / 100, 3) + ')≈' + fx(abs, 1) + ' 个百分点。',
    targetSec: 45, meta: { kind: 'shift', P1: P1, W1: W1, a: a, b: b, truth: truth }
  };
}

/* 4. 平均数增长率 */
function makeAvg(diff){
  const totalName = pick(['营业收入', '利润总额', '销售额', '研发投入', '产量']);
  const unitName = pick(['从业人员', '企业数量', '门店数量', '职工人数']);
  const a = round(rf(3, 20), 1);
  let b = round(rf(1, 12), 1);
  if (Math.abs(a - b) < 1.2) b = round(a >= 6 ? a - 2.4 : a + 2.4, 1);
  const truth = ((1 + a / 100) / (1 + b / 100) - 1) * 100;
  // 干扰项：直接相减 a-b（最常见错误）、符号反、倍数偏差
  const key = pct(truth, 1);
  const list = [key];
  const cands = [a - b, -truth, truth * 1.18, truth - 1.1, truth + 1.3, a - b + 0.9, truth * 0.82, truth - 2.0];
  for (const v of cands){
    if (list.length >= 4) break;
    const s = pct(v, 1);
    if (s !== key && list.indexOf(s) < 0 && Math.abs(v - truth) >= 0.35) list.push(s);
  }
  let gA = 0;
  while (list.length < 4 && gA++ < 40){
    const s = pct(truth + (gA % 2 ? 1 : -1) * (0.6 + gA * 0.4), 1);
    if (list.indexOf(s) < 0) list.push(s);
  }
  const o = { options: shuffle(list), answer: 0 };
  o.answer = o.options.indexOf(key);
  return {
    id: qid(), tag: 'avg', kind: 'calc', diff: diff,
    stem: '2023年某行业' + totalName + '同比增长 ' + pct(a, 1) + '，' + unitName + '同比增长 ' + pct(b, 1) + '。求人均（或户均）' + totalName + '同比增长率。',
    options: o.options, answer: o.answer, tip: TIPS.avg,
    explain: '平均数增长率＝(1＋' + fx(a / 100, 3) + ')÷(1＋' + fx(b / 100, 3) + ')－1≈ ' + pct(truth, 1) + '。注意不是 a－b＝' + pct(a - b, 1) + '。',
    targetSec: 35, meta: { kind: 'avg', a: a, b: b, truth: truth }
  };
}

/* 5. 特征分数 */
function makeFrac(diff){
  const den = pick([6, 7, 8, 9, 11, 12, 13, 14, 15, 16, 17, 18, 19]);
  const num = ri(1, den - 1);
  const truth = num / den * 100;
  const reverse = RAND() < 0.28;
  if (!reverse){
    const o = buildOptions(truth, v => pct(v, 1),
      [truth + 1.2, truth - 0.9, truth + 2.0, truth - 1.8, truth * 1.1], 4);
    return {
      id: qid(), tag: 'frac', kind: 'calc', diff: diff,
      stem: num + '/' + den + ' 约等于百分之几？',
      options: o.options, answer: o.answer, tip: TIPS.frac,
      explain: num + '/' + den + '＝' + fx(truth / 100, 4) + '≈ ' + pct(truth, 1) + '（记住 1/' + den + '≈' + pct(100 / den, 1) + '）。',
      targetSec: 12, meta: { kind: 'frac', num: num, den: den, truth: truth }
    };
  }
  const good = num + '/' + den;
  const distOf = (s) => { const p2 = s.split('/'); return Math.abs(Number(p2[0]) / Number(p2[1]) * 100 - truth); };
  const pool = [];
  for (let d2 = 6; d2 <= 19; d2++){
    for (let m2 = 1; m2 < d2; m2++){
      const s = m2 + '/' + d2;
      if (s !== good && distOf(s) > 1.3) pool.push(s);
    }
  }
  const opts = shuffle([good].concat(shuffle(pool).slice(0, 3)));
  const idx = opts.indexOf(good);
  return {
    id: qid(), tag: 'frac', kind: 'calc', diff: diff,
    stem: pct(truth, 1) + ' 最接近下面哪个分数？',
    options: opts, answer: idx,
    tip: TIPS.frac,
    explain: num + '/' + den + '≈' + pct(truth, 1) + '；其余选项分别约等于 ' + opts.filter(s => s !== good).map(s => {
      const p2 = s.split('/'); return pct(Number(p2[0]) / Number(p2[1]) * 100, 1);
    }).join('、') + '。',
    targetSec: 12, meta: { kind: 'fracRev', num: num, den: den, truth: truth }
  };
}

/* 6. 速算乘法 / 平方 / 拆分 */
function makeMult(diff){
  const variant = pick(['two', 'two', 'square']);
  if (variant === 'two'){
    const a = ri(21, 99), b = ri(21, 99);
    const truth = a * b;
    const o = buildOptions(truth, v => String(Math.round(v)),
      [truth + a, truth - b, truth + 10, truth - 10, truth + 100, truth - 100, (a + 1) * b], 4);
    return {
      id: qid(), tag: 'mult', kind: 'calc', diff: diff,
      stem: a + ' × ' + b + ' ＝ ？',
      options: o.options, answer: o.answer, tip: TIPS.mult,
      explain: a + '×' + b + '＝' + a + '×' + (Math.floor(b / 10) * 10) + '＋' + a + '×' + (b % 10) + '＝' + (a * Math.floor(b / 10) * 10) + '＋' + (a * (b % 10)) + '＝' + truth + '。',
      targetSec: 10, meta: { kind: 'mult', a: a, b: b, truth: truth }
    };
  }
  const k = ri(2, 19);
  const sign = RAND() < 0.5 ? 1 : -1;
  const base = 100 + sign * k;
  const truth = base * base;
  const o = buildOptions(truth, v => String(Math.round(v)),
    [truth + sign * 200, truth - sign * 200, (100 + sign * (k - 1)) ** 2, (100 + sign * (k + 1)) ** 2, truth + 1], 4);
  return {
    id: qid(), tag: 'mult', kind: 'calc', diff: diff,
    stem: base + '² ＝ ？',
    options: o.options, answer: o.answer, tip: TIPS.mult,
    explain: '用 (100±k)²＝10000±200k＋k²：' + base + '²＝10000' + (sign > 0 ? '＋' : '－') + (200 * k) + '＋' + (k * k) + '＝' + truth + '。',
    targetSec: 12, meta: { kind: 'square', base: base, truth: truth }
  };
}

/* 7. 分数比较（差分法） */
function makeCompare(diff){
  const a = ri(21, 97), b = ri(21, 97);
  const r1 = a / b;
  const d = ri(21, 97);
  const e = (RAND() < 0.5 ? 1 : -1) * rf(0.004, 0.03);
  const c = Math.max(3, Math.round(r1 * (1 + e) * d));
  const left = a * d, right = c * b;
  if (left === right) return makeCompare(diff);
  const bigger = left > right ? '甲' : '乙';
  const options = ['甲＞乙', '甲＜乙', '甲＝乙', '无法判断'];
  const key = bigger === '甲' ? '甲＞乙' : '甲＜乙';
  return {
    id: qid(), tag: 'compare', kind: 'calc', diff: diff,
    stem: '甲数＝' + a + '/' + b + '，乙数＝' + c + '/' + d + '，比较大小。',
    options: options, answer: options.indexOf(key), tip: TIPS.compare,
    explain: '交叉相乘：' + a + '×' + d + '＝' + left + '，' + c + '×' + b + '＝' + right + '，故' + key + '。',
    targetSec: 20, meta: { kind: 'compare', a: a, b: b, c: c, d: d, left: left, right: right }
  };
}

function makeCalc(diff, tag){
  diff = diff || 2;
  if (!tag) tag = pick(CALC_TAGS);
  switch (tag){
    case 'div': return makeDiv(diff);
    case 'growth': return makeGrowth(diff);
    case 'weight': return makeWeight(diff);
    case 'avg': return makeAvg(diff);
    case 'frac': return makeFrac(diff);
    case 'mult': return makeMult(diff);
    case 'compare': return makeCompare(diff);
    default: return makeDiv(diff);
  }
}

/* ============================================================
 * 材料类题目（找数能力）
 * ============================================================ */
const PROV = ['A省', 'B省', 'C市', 'D市', 'E自治区', 'F省'];

function mkFactBox(){
  const facts = {}; const order = [];
  return {
    facts, order,
    add(id, label, disp, num, unit){
      facts[id] = { id: id, label: label, disp: disp, dispAbs: String(disp).replace('-', ''), num: num, unit: unit };
      order.push(id);
      return id;
    }
  };
}
function compose(paras, box, title){
  const out = paras.map(p => {
    const segs = []; const re = /\{([A-Za-z0-9_]+)\}/g; let last = 0, m;
    while ((m = re.exec(p)) !== null){
      if (m.index > last) segs.push({ s: p.slice(last, m.index) });
      const f = box.facts[m[1]];
      segs.push({ id: m[1], s: f ? f.disp : '' });
      last = re.lastIndex;
    }
    if (last < p.length) segs.push({ s: p.slice(last) });
    // 负增长在材料里写成“下降 x%”，但点击值与答案仍按带符号的增速计
    for (let i = 1; i < segs.length; i++){
      const cur = segs[i], prev = segs[i - 1];
      if (cur.id && prev && prev.s && !prev.id && /增长\s*$/.test(prev.s)){
        const f2 = box.facts[cur.id];
        if (f2 && f2.num < 0){
          prev.s = prev.s.replace(/增长(\s*)$/, '下降$1');
          cur.s = f2.dispAbs;
        }
      }
    }
    return segs;
  });
  return { kind: 'text', title: title, paras: out, facts: box.facts, order: box.order };
}

const MAT_FAMILIES = [matEconomy, matIndustry, matPeople, matEnergy];

/* ---------- 由文字材料出题 ---------- */
function locateFromText(diff){
  const mat = pick(MAT_FAMILIES)(diff);
  const facts = mat.facts;
  const ids = mat.order;
  const valIds = ids.filter(id => facts[id].unit !== '%');
  const rateIds = ids.filter(id => facts[id].unit === '%');

  const mode = pick(diff >= 3 ? ['value', 'rate', 'pair', 'pair'] : ['value', 'value', 'rate', 'pair']);
  let stem, answerIds, explain, tag = 'locate';

  if (mode === 'value'){
    const id = pick(valIds);
    const f = facts[id];
    stem = '材料中「' + f.label + '」的数值是多少？请点击材料中的对应数据。';
    answerIds = [id];
    explain = '「' + f.label + '」对应材料中的 ' + f.disp + '。找数时先定时间（' + (f.label.match(/^\d{4}/) || ['当年'])[0] + '），再逐字核对主体名称，最后看清是否带“增速/占比”等限定语。';
  } else if (mode === 'rate'){
    const id = pick(rateIds);
    const f = facts[id];
    stem = '材料中「' + f.label + '」的同比增速是多少？请点击对应数据。';
    answerIds = [id];
    explain = '增速是带 % 的那一项：' + f.disp + '。材料里同一主体的绝对值和增速往往紧挨着出现，别点错。';
  } else {
    const byUnit = {};
    valIds.forEach(id => { const u = facts[id].unit; (byUnit[u] = byUnit[u] || []).push(id); });
    const groups = Object.keys(byUnit).filter(u => byUnit[u].length >= 2);
    let g = groups.length ? pick(groups) : null;
    if (!g) return locateFromText(diff);
    const arr = shuffle(byUnit[g]).slice(0, 2);
    const f1 = facts[arr[0]], f2 = facts[arr[1]];
    stem = '要计算「' + f1.label + '」比「' + f2.label + '」多（少）多少，需要点击材料中的哪两处数据？';
    answerIds = arr;
    explain = '两处分别为 ' + f1.disp + ' 与 ' + f2.disp + '，同单位（' + g + '）直接相减即可；若单位不同要先换算。';
    tag = 'locate';
  }
  return {
    id: qid(), tag: tag, kind: 'locate', diff: diff,
    stem: stem, material: mat, answerIds: answerIds, multi: answerIds.length,
    explain: explain, tip: TIPS.locate, targetSec: answerIds.length > 1 ? 40 : 22
  };
}

/* ---------- 表格材料 ---------- */
function makeTableMaterial(diff){
  const fam = pick(['industry', 'trade']);
  const P = pick(PROV);
  const years = diff >= 3 ? ['2020', '2021', '2022', '2023'] : ['2021', '2022', '2023'];
  const box = mkFactBox();
  const rows = [];

  function addRow(name, unit, base, growth, d){
    const cells = [];
    let v = base;
    const rowCells = [];
    years.forEach((y, i) => {
      if (i > 0) v = v * (1 + (growth + rf(-0.02, 0.02)) / 100);
      const val = round(v, d);
      const id = 'c' + rows.length + '_' + i;
      box.add(id, y + '年' + name, fx(val, d) + unit, val, unit);
      rowCells.push({ id: id, s: fx(val, d) });
      cells.push({ id: id, s: fx(val, d) });
    });
    void rowCells;
    rows.push({ name: name + '（' + unit + '）', cells: cells, unit: unit, nums: cells.map(c => Number(c.s)) });
  }

  const gdp = round(rf(2000, 8600), 1);
  const gG = round(rf(3, 10), 1);
  const p1 = gdp * rf(0.08, 0.13), p2 = gdp * rf(0.34, 0.45), p3 = gdp - p1 - p2;
  addRow('地区生产总值', '亿元', gdp, gG, 1);
  addRow('第一产业增加值', '亿元', p1, rf(1, 7), 1);
  addRow('第二产业增加值', '亿元', p2, rf(2, 10), 1);
  addRow('第三产业增加值', '亿元', p3, rf(4, 12), 1);
  if (fam === 'industry'){
    addRow('社会消费品零售总额', '亿元', rf(700, 4600), rf(-1, 12), 1);
    addRow('固定资产投资', '亿元', rf(900, 5200), rf(-4, 11), 1);
    addRow('居民人均可支配收入', '元', ri(26000, 46000), rf(3, 9), 0);
  } else {
    const tr = rf(600, 3800);
    addRow('进出口总额', '亿元', tr, rf(-3, 16), 1);
    addRow('出口额', '亿元', tr * rf(0.45, 0.62), rf(-2, 18), 1);
    addRow('进口额', '亿元', tr * rf(0.35, 0.5), rf(-6, 14), 1);
    addRow('实际利用外资', '万美元', rf(1000, 30000), rf(-8, 20), 0);
  }

  return {
    kind: 'table', title: P + '主要经济指标', head: ['指标'].concat(years.map(y => y + '年')),
    rows: rows, facts: box.facts, order: box.order, years: years, prov: P
  };
}

function locateFromTable(diff){
  const mat = makeTableMaterial(diff);
  const ids = mat.order;
  const id = pick(ids);
  const f = mat.facts[id];
  return {
    id: qid(), tag: 'table', kind: 'locate', diff: diff,
    stem: '表中「' + f.label + '」是多少？请点击对应单元格。',
    material: mat, answerIds: [id], multi: 1,
    explain: '先横向找到指标所在行，再纵向找到年份所在列，交叉单元格即 ' + f.disp + '。注意表头单位。',
    tip: TIPS.table, targetSec: 20
  };
}

function makeLocate(diff){
  return RAND() < 0.6 ? locateFromText(diff) : locateFromTable(diff);
}

/* ============================================================
 * 综合套题：表格材料 + 5 题
 * ============================================================ */
function makePaper(diff){
  const mat = makeTableMaterial(diff);
  const years = mat.years;
  const y0 = years[0], yn = years[years.length - 1];
  const questions = [];
  const rowByName = (kw) => mat.rows.find(r => r.name.indexOf(kw) >= 0);

  // 1) 表格找数
  {
    const id = pick(mat.order);
    const f = mat.facts[id];
    questions.push({
      id: qid(), tag: 'table', kind: 'locate', diff: diff,
      stem: '表中「' + f.label + '」是多少？请点击对应单元格。',
      material: mat, answerIds: [id], multi: 1,
      explain: '横向找指标、纵向找年份，交叉处为 ' + f.disp + '。',
      tip: TIPS.table, targetSec: 20
    });
  }
  // 2) 增长率
  {
    const r = rowByName('生产总值') || mat.rows[0];
    const n = r.nums;
    const truth = (n[n.length - 1] - n[0]) / n[0] * 100;
    const o = buildOptions(truth, v => pct(v, 1), [truth + 0.8, truth - 0.7, truth + 1.6, truth * 1.2], 4);
    questions.push({
      id: qid(), tag: 'growth', kind: 'calc', diff: diff,
      stem: '表中' + r.name.replace(/（.*/, '') + '从' + y0 + '年到' + yn + '年的增长率约为？',
      material: mat, options: o.options, answer: o.answer, tip: TIPS.growth,
      explain: '增长率＝(' + fx(n[n.length - 1], 1) + '－' + fx(n[0], 1) + ')÷' + fx(n[0], 1) + '≈ ' + pct(truth, 1) + '。',
      targetSec: 40
    });
  }
  // 3) 比重
  {
    const total = rowByName('生产总值');
    const part = rowByName('第二产业') || rowByName('出口') || mat.rows[1];
    if (total && part && part !== total){
      const i = years.length - 1;
      const truth = part.nums[i] / total.nums[i] * 100;
      const o = buildOptions(truth, v => pct(v, 1), [truth + 0.5, truth - 0.4, truth + 1.1, 100 - truth], 4);
      questions.push({
        id: qid(), tag: 'weight', kind: 'calc', diff: diff,
        stem: '表中' + yn + '年' + part.name.replace(/（.*/, '') + '占' + total.name.replace(/（.*/, '') + '的比重约为？',
        material: mat, options: o.options, answer: o.answer, tip: TIPS.weight,
        explain: '比重＝' + fx(part.nums[i], 1) + '÷' + fx(total.nums[i], 1) + '≈ ' + pct(truth, 1) + '。',
        targetSec: 35
      });
    }
  }
  // 4) 增长量
  {
    const r = pick(mat.rows);
    const n = r.nums;
    const truth = n[n.length - 1] - n[0];
    const o = buildOptions(truth, v => fx(v, 1), [truth * 1.06, truth * 0.94, truth + 20, truth - 15], 4);
    questions.push({
      id: qid(), tag: 'growth', kind: 'calc', diff: diff,
      stem: '表中' + r.name.replace(/（.*/, '') + yn + '年比' + y0 + '年增加约多少？',
      material: mat, options: o.options, answer: o.answer, tip: TIPS.growth,
      explain: '增长量＝' + fx(n[n.length - 1], 1) + '－' + fx(n[0], 1) + '＝' + fx(truth, 1) + '。',
      targetSec: 30
    });
  }
  // 5) 平均/年均
  {
    const r = pick(mat.rows);
    const n = r.nums;
    const truth = n.reduce((s, x) => s + x, 0) / n.length;
    const o = buildOptions(truth, v => fx(v, 1), [truth * 1.03, truth * 0.97, truth * 1.06, Math.max(...n)], 4);
    questions.push({
      id: qid(), tag: 'avg', kind: 'calc', diff: diff,
      stem: '表中' + r.name.replace(/（.*/, '') + '各年数值的平均数约为？',
      material: mat, options: o.options, answer: o.answer, tip: TIPS.avg,
      explain: '合计数 ' + fx(n.reduce((s, x) => s + x, 0), 1) + ' ÷ ' + n.length + ' 年 ≈ ' + fx(truth, 1) + '。',
      targetSec: 35
    });
  }
  return {
    id: qid(), kind: 'paper', diff: diff, title: mat.title,
    material: mat, questions: shuffle(questions)
  };
}

  { t: '平均数增长率', b: '(1＋总量增速) ÷ (1＋份数增速) － 1。\n与平均数本身的大小无关，两个增速换一下位置答案就变了。' },
  { t: '特征分数表', b: '1/6=16.7%  1/7=14.3%  1/8=12.5%  1/9=11.1%\n1/11=9.1%  1/12=8.3%  1/13=7.7%  1/14=7.1%\n1/15=6.7%  1/16=6.3%  1/17=5.9%  1/18=5.6%  1/19=5.3%\n2/7=28.6%  3/7=42.9%  2/9=22.2%  3/8=37.5%  5/8=62.5%\n见到 12.5%、16.7%、8.3% 立刻转成 1/8、1/6、1/12。' },
  { t: '分数比较与差分法', b: '先直除比首位；接近时用差分法：\n甲＝a/b，乙＝c/d，作差分数 (a－c)/(b－d)，\n若差分数 ＞ 乙，则 甲 ＞ 乙；反之亦然。\n大规模题目可直接交叉相乘。' },
  { t: '找数三步法', b: '① 圈时间：题干是现期还是基期，材料有没有“上年”。\n② 圈主体：逐字比对，“城镇居民”不是“居民”，“其中”后面才是细分。\n③ 圈考点：多少、增速、比重、平均、倍数——先定公式再找数。\n材料再长，也只找这三样，其余全是干扰。' },
  { t: '常见陷阱', b: '· 单位：万元 / 亿元、万人 / 人\n· 口径：同比 / 环比、累计 / 当月\n· 表述：“是几倍” vs “多几倍”（差 1）\n· 百分点 / 百分数：比重变化用百分点\n· 排序题：问“最大”别答成“最小”' }
];

const Bank = {
  setRandom: setRandom,
  makeCalc: makeCalc, makeLocate: makeLocate, makePaper: makePaper,
  makeDiv: makeDiv, makeGrowth: makeGrowth, makeWeight: makeWeight,
  makeAvg: makeAvg, makeFrac: makeFrac, makeMult: makeMult, makeCompare: makeCompare,
  makeTableMaterial: makeTableMaterial, matEconomy: matEconomy,
  TIPS: TIPS, TAG_NAME: TAG_NAME, CALC_TAGS: CALC_TAGS, GUIDE: GUIDE,
  util: { round: round, fx: fx, pct: pct, sig3: sig3, shuffle: shuffle }
};

global.XCGen = Bank;
if (typeof module !== 'undefined' && module.exports) module.exports = Bank;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== XC Sprint · 界面与状态机 ===== */
(function () {
'use strict';
var G = window.XCGen;
var $ = function (s, r) { return (r || document).querySelector(s); };
var KEY = 'xc.sprint.v1';
var DEFAULTS = { theme: 'dark', count: 10, diff: 2, timer: true, haptic: true, sound: false };

/* ---------------- 存储 ---------------- */
function loadStore() {
  var base = { settings: Object.assign({}, DEFAULTS), stats: {}, days: {}, total: 0, totalOk: 0, records: [] };
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return base;
    var p = JSON.parse(raw);
    base.settings = Object.assign({}, DEFAULTS, p.settings || {});
    base.stats = p.stats || {};
    base.days = p.days || {};
    base.total = p.total || 0;
    base.totalOk = p.totalOk || 0;
    base.records = (p.records || []).slice(-40);
  } catch (e) { /* 忽略损坏数据 */ }
  return base;
}
var ST = loadStore();
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }

function todayKey() {
  var d = new Date();
  var m = String(d.getMonth() + 1), day = String(d.getDate());
  return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
}
function dayOf(offset) {
  var d = new Date(); d.setDate(d.getDate() - offset);
  var m = String(d.getMonth() + 1), day = String(d.getDate());
  return d.getFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (day.length < 2 ? '0' + day : day);
}

/* ---------------- 工具 ---------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtSec(ms) {
  var s = ms / 1000;
  if (s < 10) return (Math.round(s * 10) / 10).toFixed(1) + 's';
  if (s < 60) return Math.round(s) + 's';
  var m = Math.floor(s / 60), r = Math.round(s % 60);
  return m + 'm' + (r < 10 ? '0' : '') + r + 's';
}
function buzz(ms) {
  if (!ST.settings.haptic) return;
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

/* ---------------- 全局状态 ---------------- */
var S = {
  view: 'home',
  mode: null,
  idx: 0,
  list: [],
  cur: null,
  sessionStart: 0,
  timerId: null,
  result: null
};

/* ---------------- 卡片 / 组件 ---------------- */
function topbar(title, opts) {
  opts = opts || {};
  var right = '';
  if (opts.timer) right = '<span class="timer" id="timer">0s</span>';
  if (opts.extra) right += opts.extra;
  return '<div class="topbar">' +
    (opts.back ? '<button class="icon-btn" data-act="back" aria-label="返回">←</button>' : '') +
    '<h1>' + esc(title) + '</h1>' + right + '</div>';
}
function tabbar(active) {
  var items = [['home', '⚡', '训练'], ['stats', '📊', '统计'], ['guide', '📘', '手册']];
  return '<nav class="tabbar"><div class="tabinner">' + items.map(function (it) {
    return '<button data-act="tab" data-v="' + it[0] + '" class="' + (active === it[0] ? 'on' : '') + '">' +
      '<span class="ti">' + it[1] + '</span>' + it[2] + '</button>';
  }).join('') + '</div></nav>';
}

/* ---------------- 首页 ---------------- */
function renderHome() {
  var s = ST.settings;
  var d = ST.days[todayKey()] || { n: 0, ok: 0 };
  var acc = ST.total ? Math.round(ST.totalOk / ST.total * 100) : 0;
  var html = topbar('行测·资料分析训练', {
    extra: '<button class="icon-btn" data-act="theme" aria-label="切换主题">' + (s.theme === 'dark' ? '☀' : '🌙') + '</button>'
  });
  html += '<div id="appbody">';
  html += '<div class="hero"><div class="kicker">资料分析 · 专项提升</div>' +
    '<h2>算得快，也找得准</h2>' +
    '<p>计算训练磨截位直除与常用公式，找数训练带着你从材料里把数抠出来。双端离线可用。</p></div>';

  html += '<div class="card" style="display:flex;gap:14px;align-items:center;justify-content:space-between">' +
    '<div><div class="label">今日</div><div style="font-size:20px;font-weight:750">' + d.n + ' 题 · 正确率 ' + (d.n ? Math.round(d.ok / d.n * 100) : 0) + '%</div></div>' +
    '<div style="text-align:right"><div class="label">累计</div><div style="font-size:20px;font-weight:750">' + ST.total + ' 题 · ' + acc + '%</div></div>' +
    '</div>';

  html += '<div class="section-title">开始训练</div><div class="grid">';
  html += modeCard('calc', '🧮', '计算能力', '截位直除、增长率、比重、平均数、特征分数、速算乘法', ['限时', '即时解析', '技巧提示']);
  html += modeCard('locate', '🔍', '找数能力', '统计公报式材料，点出题干要的那个数（含双数据定位）', ['文字材料', '表格材料', '单位陷阱']);
  html += modeCard('paper', '📄', '综合模考', '一张表格材料 + 5 道题，还原真实资料分析节奏', ['找数+计算', '整组计时']);
  html += '</div>';

  html += '<div class="section-title">本组设置</div><div class="card">';
  html += '<div class="label" style="margin-bottom:6px">题量</div>' +
    seg('count', [['10', '10 题'], ['20', '20 题'], ['30', '30 题']], String(s.count)) +
    '<div class="sp10"></div><div class="label" style="margin-bottom:6px">难度</div>' +
    seg('diff', [['1', '基础'], ['2', '进阶'], ['3', '高难']], String(s.diff)) +
    '<div class="sp10"></div>' +
    '<div class="row between"><div><div class="label">计时模式</div><div class="muted" style="font-size:12.5px">关闭后不计时，适合刚学技巧时使用</div></div>' +
    '<button class="btn small ' + (s.timer ? 'primary' : '') + '" data-act="toggle-timer">' + (s.timer ? '已开启' : '已关闭') + '</button></div>';
  html += '</div>';
  html += '<div class="sp16"></div><p class="muted center" style="font-size:12px">数据只保存在本机浏览器 · 建议在手机浏览器“添加到主屏幕”</p>';
  html += '</div>';
  html += tabbar('home');
  return html;
}
function modeCard(id, ico, title, desc, tags) {
  return '<button class="mode" data-act="start" data-mode="' + id + '">' +
    '<span class="ico">' + ico + '</span>' +
    '<span style="flex:1;min-width:0"><h3>' + title + '</h3><p>' + desc + '</p>' +
    '<span class="tagline">' + tags.map(function (t) { return '<span class="chip">' + t + '</span>'; }).join('') + '</span></span>' +
    '<span class="muted" style="align-self:center">›</span></button>';
}
function seg(name, opts, cur) {
  return '<div class="seg">' + opts.map(function (o) {
    return '<button data-act="seg" data-k="' + name + '" data-v="' + o[0] + '" class="' + (o[0] === cur ? 'on' : '') + '">' + o[1] + '</button>';
  }).join('') + '</div>';
}

/* ---------------- 材料渲染 ---------------- */
function renderMaterial(mat, interactive) {
  var h = '<div class="material"><div class="mtitle"><span>' + esc(mat.title || '材料') + '</span>' +
    '<span class="chip">' + (interactive ? '点击数据作答' : '参考材料') + '</span></div>';
  if (mat.kind === 'text') {
    h += mat.paras.map(function (p) {
      return '<p>' + p.map(function (seg2) {
        if (seg2.id) return '<span class="num" data-fid="' + seg2.id + '">' + esc(seg2.s) + '</span>';
        return esc(seg2.s);
      }).join('') + '</p>';
    }).join('');
  } else {
    h += '<div class="twrap"><table class="mat"><thead><tr><th>' + esc(mat.head[0]) + '</th>' +
      mat.head.slice(1).map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      mat.rows.map(function (r) {
        return '<tr><td>' + esc(r.name) + '</td>' + r.cells.map(function (c) {
          return '<td class="cell" data-fid="' + c.id + '">' + esc(c.s) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  return h + '</div>';
}

/* ---------------- 会话 ---------------- */
function newQuestion() {
  var diff = ST.settings.diff;
  if (S.mode === 'calc') return G.makeCalc(diff);
  if (S.mode === 'locate') return G.makeLocate(diff);
  return null;
}
function startSession(mode) {
  S.mode = mode;
  S.idx = 0;
  S.list = [];
  S.sess = { ok: 0, ms: 0, items: [] };
  S.sessionStart = Date.now();
  if (mode === 'paper') {
    var p = G.makePaper(ST.settings.diff);
    S.list = p.questions;
    S.paper = p;
  } else {
    var n = ST.settings.count;
    for (var i = 0; i < n; i++) S.list.push(newQuestion());
  }
  S.view = 'session';
  S.cur = { q: S.list[0], sel: [], chosen: null, locked: false, t0: Date.now() };
  render();
  startTimer();
}
function startTimer() {
  stopTimer();
  if (!ST.settings.timer) return;
  S.timerId = setInterval(function () {
    var el = $('#timer');
    if (!el) return;
    var ms = Date.now() - (S.cur ? S.cur.t0 : S.sessionStart);
    el.textContent = fmtSec(ms);
    var lim = S.cur && S.cur.q.targetSec ? S.cur.q.targetSec * 1000 : 0;
    el.classList.toggle('hot', lim > 0 && ms > lim * 1.5);
  }, 250);
}
function stopTimer() { if (S.timerId) { clearInterval(S.timerId); S.timerId = null; } }

function renderSession() {
  var q = S.cur.q;
  var total = S.list.length;
  var isLocate = q.kind === 'locate';
  var html = topbar(modeName(S.mode) + ' · ' + (S.idx + 1) + '/' + total, { back: true, timer: ST.settings.timer });
  html += '<div id="appbody"><div class="progress"><i style="width:' + Math.round(S.idx / total * 100) + '%"></i></div>';
  html += '<div class="meta-line"><span class="chip on">' + esc(G.TAG_NAME[q.tag] || '题目') + '</span>' +
    '<span class="chip">建议 ' + (q.targetSec || 30) + 's</span>' +
    (isLocate ? '<span class="chip">需点选 ' + q.multi + ' 处</span>' : '') + '</div>';
  var matHtml = q.material ? renderMaterial(q.material, isLocate) : '';
  var stemHtml = '<div class="stem">' + esc(q.stem) + '</div>';
  // 找数题先给目标，再给材料；计算/模考题先给材料
  html += isLocate ? (stemHtml + matHtml) : (matHtml + stemHtml);
  if (q.options) {
    var two = q.options.every(function (o) { return o.length <= 10; });
    html += '<div class="opts' + (two ? ' two' : '') + '">' + q.options.map(function (o, i) {
      return '<button class="opt" data-act="opt" data-i="' + i + '"><span class="k">' + (i + 1) + '</span>' + esc(o) + '</button>';
    }).join('') + '</div>';
  } else {
    html += '<div class="muted" style="font-size:13px">在材料/表格中点击你认为需要的数据，再点“提交”。</div>';
  }
  html += '<div id="fb"></div>';
  html += '</div>';
  html += '<div class="actionbar"><div class="inner">' +
    '<button class="btn ghost" data-act="skip">跳过</button>' +
    '<button class="btn primary" data-act="submit" id="submitBtn" disabled>提交</button>' +
    '</div></div>';
  return html;
}
function modeName(m) { return m === 'calc' ? '计算' : m === 'locate' ? '找数' : '模考'; }

/* ---------------- 提交与反馈 ---------------- */
function updateSubmitState() {
  var btn = $('#submitBtn');
  if (!btn) return;
  var q = S.cur.q;
  if (q.options) btn.disabled = S.cur.chosen == null;
  else btn.disabled = S.cur.sel.length !== q.multi;
}

function submitAnswer(skip) {
  var c = S.cur, q = c.q;
  if (c.locked) { nextQuestion(); return; }
  if (!skip) {
    if (q.options && c.chosen == null) return;
    if (!q.options && c.sel.length !== q.multi) return;
  }
  var ms = Date.now() - c.t0;
  var correct = false;
  if (skip) { correct = false; }
  else if (q.options) { correct = (c.chosen === q.answer); }
  else {
    var need = q.answerIds.slice().sort().join('|');
    var got = c.sel.slice().sort().join('|');
    correct = (need === got);
  }
  c.locked = true;
  c.correct = correct;
  c.ms = ms;
  buzz(correct ? 18 : [12, 60, 12]);
  markDom(correct);
  showFeedback(correct);
  recordAnswer(q, correct, ms, c.chosen);
  var bar = $('.actionbar .inner');
  if (bar) bar.innerHTML = '<button class="btn ghost" data-act="quit">结束</button><button class="btn primary" data-act="next" id="submitBtn">' +
    (S.idx + 1 >= S.list.length ? '看结果' : '下一题') + '</button>';
}
function markDom(correct) {
  var c = S.cur, q = c.q;
  if (q.options) {
    document.querySelectorAll('.opt').forEach(function (el, i) {
      el.classList.remove('sel');
      if (i === q.answer) el.classList.add('correct');
      else if (i === c.chosen) el.classList.add('wrong');
      el.disabled = true;
    });
    return;
  }
  var need = q.answerIds.join('|');
  document.querySelectorAll('[data-fid]').forEach(function (el) {
    var id = el.getAttribute('data-fid');
    var picked = c.sel.indexOf(id) >= 0;
    var isNeed = need.split('|').indexOf(id) >= 0;
    el.classList.remove('sel');
    if (picked && isNeed) el.classList.add('hit');
    else if (picked && !isNeed) el.classList.add('miss');
    else if (!picked && isNeed) el.classList.add('reveal');
  });
}
function showFeedback(correct) {
  var c = S.cur, q = c.q;
  var h = '<div class="feedback ' + (correct ? 'good' : 'bad') + '">';
  h += '<div class="head">' + (correct ? '✓ 正确' : '✗ 再看一遍') + '<span class="muted" style="font-weight:400;font-size:12.5px;margin-left:auto">用时 ' + fmtSec(c.ms) + '</span></div>';
  h += '<div class="body">' + esc(q.explain) + '</div>';
  if (q.options && !correct) {
    h += '<div class="body" style="margin-top:6px">正确答案：<b>' + esc(q.options[q.answer]) + '</b></div>';
  }
  if (!q.options && !correct) {
    var names = q.answerIds.map(function (id) { return q.material.facts[id]; }).filter(Boolean)
      .map(function (f) { return '<b>' + esc(f.disp) + '</b>（' + esc(f.label) + '）'; }).join('、');
    h += '<div class="body" style="margin-top:6px">应选：' + names + '</div>';
  }
  if (q.tip) h += '<div class="tipbox"><b>技巧</b> · ' + esc(q.tip) + '</div>';
  h += '</div>';
  var box = $('#fb');
  if (box) box.innerHTML = h;
}
function recordAnswer(q, correct, ms, chosen) {
  if (!S.sess) S.sess = { ok: 0, ms: 0, items: [] };
  S.sess.ok += correct ? 1 : 0;
  S.sess.ms += ms;
  S.sess.items.push({ q: q, correct: correct, ms: ms, chosen: (chosen == null ? null : chosen) });
  ST.total += 1;
  if (correct) ST.totalOk += 1;
  var day = ST.days[todayKey()] || { n: 0, ok: 0 };
  day.n += 1; if (correct) day.ok += 1;
  ST.days[todayKey()] = day;
  var st = ST.stats[q.tag] || { n: 0, ok: 0, ms: 0 };
  st.n += 1; if (correct) st.ok += 1; st.ms += ms;
  ST.stats[q.tag] = st;
  save();
}

/* ---------------- 下一题 / 结束 ---------------- */
function nextQuestion() {
  if (S.idx + 1 >= S.list.length) return finishSession();
  S.idx += 1;
  S.cur = { q: S.list[S.idx], sel: [], chosen: null, locked: false, t0: Date.now() };
  render();
  startTimer();
}
function finishSession() {
  stopTimer();
  var total = S.list.length;
  var sess = S.sess || { ok: 0, ms: 0, items: [] };
  var ok = sess.ok, ms = sess.ms;
  var acc = total ? Math.round(ok / total * 100) : 0;
  S.sess = { ok: 0, ms: 0, items: [] };
  S.result = {
    mode: S.mode, total: total, ok: ok, acc: acc,
    avgMs: total ? ms / total : 0, totalMs: ms,
    items: sess.items
  };
  S.view = 'result';
  render();
}
function renderResult() {
  var r = S.result;
  var good = r.acc >= 80;
  var html = topbar('本组结果', { back: true });
  html += '<div id="appbody">';
  html += '<div class="card">';
  html += '<div class="score"><span class="big" style="color:' + (good ? 'var(--ok)' : r.acc >= 50 ? 'var(--warn)' : 'var(--bad)') + '">' + r.acc + '</span><span class="unit">% 正确率 · ' + r.ok + '/' + r.total + '</span></div>';
  html += '<div class="muted" style="font-size:13.5px">' + (good ? '节奏不错，继续保持。' : '错题解析在下面，先看思路再看算式。') + '</div>';
  html += '<div class="statgrid">' +
    '<div class="stat"><div class="v">' + r.total + '</div><div class="k">题量</div></div>' +
    '<div class="stat"><div class="v">' + fmtSec(r.avgMs) + '</div><div class="k">平均用时</div></div>' +
    '<div class="stat"><div class="v">' + fmtSec(r.totalMs) + '</div><div class="k">总用时</div></div>' +
    '</div></div>';

  // 每题用时条
  html += '<div class="section-title">每题用时（绿=对，红=错）</div><div class="card">';
  var maxMs = Math.max.apply(null, r.items.map(function (x) { return x.ms; }).concat([1]));
  html += '<div class="bars">' + r.items.map(function (x, i) {
    var hgt = Math.max(4, Math.round(x.ms / maxMs * 80));
    return '<div class="b" title="' + (x.correct ? '正确 ' : '错误 ') + fmtSec(x.ms) + '"><i style="height:' + hgt + 'px;background:' +
      (x.correct ? 'var(--ok)' : 'var(--bad)') + '"></i><span>' + (i + 1) + '</span></div>';
  }).join('') + '</div></div>';

  var wrong = r.items.filter(function (x) { return !x.correct; });
  if (wrong.length) {
    html += '<div class="section-title">错题回顾</div><div class="review">';
    html += wrong.map(function (x) {
      var q = x.q;
      var mine = q.options ? (x.chosen != null ? q.options[x.chosen] : '未作答') : '定位错误';
      var truth = q.options ? q.options[q.answer] : q.answerIds.map(function (id) {
        var f = q.material.facts[id]; return f ? f.disp : '';
      }).join(' + ');
      return '<div class="rv"><div class="q">' + esc(q.stem) + '</div>' +
        '<div class="ans">你选：<span class="n">' + esc(mine) + '</span> · 正确：<span class="y">' + esc(truth) + '</span></div>' +
        '<div class="muted" style="font-size:13px;margin-top:5px">' + esc(q.explain) + '</div></div>';
    }).join('');
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="actionbar"><div class="inner">' +
    '<button class="btn ghost" data-act="tab" data-v="home">返回</button>' +
    '<button class="btn primary" data-act="again">再来一组</button></div></div>';
  return html;
}

/* ---------------- 统计 ---------------- */
function renderStats() {
  var s = ST.settings;
  var acc = ST.total ? Math.round(ST.totalOk / ST.total * 100) : 0;
  var html = topbar('训练统计', { extra: '<button class="icon-btn" data-act="theme">' + (s.theme === 'dark' ? '☀' : '🌙') + '</button>' });
  html += '<div id="appbody">';
  html += '<div class="card"><div class="row between"><div><div class="label">累计</div><div style="font-size:26px;font-weight:800">' + ST.total + ' <span style="font-size:14px;color:var(--dim)">题</span></div></div>' +
    '<div style="text-align:right"><div class="label">总正确率</div><div style="font-size:26px;font-weight:800;color:' + (acc >= 75 ? 'var(--ok)' : acc >= 50 ? 'var(--warn)' : 'var(--bad)') + '">' + acc + '%</div></div></div>';
  var days = [];
  for (var i = 6; i >= 0; i--) days.push([dayOf(i), ST.days[dayOf(i)] || { n: 0, ok: 0 }]);
  var maxN = Math.max.apply(null, days.map(function (d) { return d[1].n; }).concat([1]));
  html += '<div class="bars" style="margin-top:16px">' + days.map(function (d) {
    var hgt = Math.max(3, Math.round(d[1].n / maxN * 72));
    return '<div class="b" title="' + d[0] + ' ' + d[1].n + '题"><i style="height:' + hgt + 'px"></i><span>' + d[0].slice(5) + '</span></div>';
  }).join('') + '</div><div class="muted center" style="font-size:12px;margin-top:6px">近 7 天做题量</div></div>';

  var tags = Object.keys(ST.stats).filter(function (t) { return ST.stats[t].n >= 3; })
    .map(function (t) { return { tag: t, n: ST.stats[t].n, ok: ST.stats[t].ok, ms: ST.stats[t].ms / ST.stats[t].n }; })
    .sort(function (a, b) { return a.ok / a.n - b.ok / b.n; });
  if (tags.length) {
    html += '<div class="section-title">分项正确率（红条越长越该练）</div><div class="card"><div class="weak">';
    html += tags.map(function (t) {
      var p = Math.round(t.ok / t.n * 100);
      return '<div class="w"><span class="n">' + esc(G.TAG_NAME[t.tag] || t.tag) + '</span>' +
        '<span class="track"><i style="width:' + (100 - p) + '%"></i></span><span class="p">' + p + '%</span></div>';
    }).join('');
    html += '</div></div>';
    var worst = tags[0];
    if (worst.ok / worst.n < 0.75) {
      var tip = G.TIPS[worst.tag] || '';
      html += '<div class="card" style="margin-top:12px"><div class="label">最该补的一项</div>' +
        '<div style="font-weight:700;margin:4px 0 6px">' + esc(G.TAG_NAME[worst.tag] || worst.tag) + ' · ' + Math.round(worst.ok / worst.n * 100) + '%</div>' +
        '<div class="muted" style="font-size:13.5px">' + esc(tip) + '</div></div>';
    }
  } else {
    html += '<div class="card" style="margin-top:14px"><div class="muted">先做几组题，这里会出现分项正确率和弱项建议。</div></div>';
  }
  html += '<div class="sp16"></div><button class="btn small" data-act="reset" style="width:100%">清空全部记录</button>';
  html += '<div class="sp16"></div></div>';
  html += tabbar('stats');
  return html;
}

/* ---------------- 技巧手册 ---------------- */
function renderGuide() {
  var s = ST.settings;
  var html = topbar('技巧手册', { extra: '<button class="icon-btn" data-act="theme">' + (s.theme === 'dark' ? '☀' : '🌙') + '</button>' });
  html += '<div id="appbody"><div class="muted" style="font-size:13.5px;padding:0 2px 12px">资料分析提分只有两条路：算得快、找得准。下面的东西背下来，做题时直接套。</div>';
  html += G.GUIDE.map(function (g, i) {
    return '<details class="guide"' + (i === 0 ? ' open' : '') + '><summary>' + esc(g.t) + '</summary><div class="gbody">' + esc(g.b) + '</div></details>';
  }).join('');
  html += '<div class="card" style="margin-top:14px"><div class="label">训练建议</div><div class="muted" style="font-size:13.5px;line-height:1.8">' +
    '① 每天先做 10 题「计算能力」，重点练截位直除和特征分数；<br>' +
    '② 再做 8 题「找数能力」，强制自己在材料上点出数据，别心算；<br>' +
    '③ 一周做 2 套「综合模考」，按 5 题 6 分钟的真实节奏压时间；<br>' +
    '④ 统计页的红条就是你下周的复习顺序。</div></div>';
  html += '<div class="sp16"></div></div>';
  html += tabbar('guide');
  return html;
}

/* ---------------- 渲染入口 ---------------- */
function render() {
  var root = $('#app');
  var html = '';
  if (S.view === 'home') html = renderHome();
  else if (S.view === 'session') html = renderSession();
  else if (S.view === 'result') html = renderResult();
  else if (S.view === 'stats') html = renderStats();
  else if (S.view === 'guide') html = renderGuide();
  root.innerHTML = html;
  applyTheme();
  if (S.view === 'session') updateSubmitState();
  window.scrollTo(0, 0);
}
function applyTheme() { document.documentElement.setAttribute('data-theme', ST.settings.theme); }

/* ---------------- 事件 ---------------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act],[data-fid]');
  if (!t) return;
  // 材料点选
  if (t.hasAttribute('data-fid')) {
    onPick(t);
    return;
  }
  var act = t.getAttribute('data-act');
  switch (act) {
    case 'start': startSession(t.getAttribute('data-mode')); break;
    case 'tab':
      S.view = t.getAttribute('data-v');
      stopTimer();
      render();
      break;
    case 'theme':
      ST.settings.theme = ST.settings.theme === 'dark' ? 'light' : 'dark';
      save(); render();
      break;
    case 'seg': {
      var k = t.getAttribute('data-k'), v = t.getAttribute('data-v');
      if (k === 'count') ST.settings.count = parseInt(v, 10);
      if (k === 'diff') ST.settings.diff = parseInt(v, 10);
      save(); render();
      break;
    }
    case 'toggle-timer':
      ST.settings.timer = !ST.settings.timer; save(); render();
      if (S.view === 'session') startTimer();
      break;
    case 'opt': {
      if (S.cur.locked) return;
      var i = parseInt(t.getAttribute('data-i'), 10);
      S.cur.chosen = i;
      document.querySelectorAll('.opt').forEach(function (el, j) { el.classList.toggle('sel', j === i); });
      updateSubmitState();
      buzz(6);
      break;
    }
    case 'submit': submitAnswer(false); break;
    case 'skip': submitAnswer(true); break;
    case 'next': nextQuestion(); break;
    case 'back':
      stopTimer();
      S.view = 'home'; render();
      break;
    case 'quit': finishSession(); break;
    case 'again': startSession(S.mode); break;
    case 'reset':
      if (window.confirm('清空全部训练记录？')) {
        localStorage.removeItem(KEY);
        ST = loadStore();
        applyTheme();
        render();
      }
      break;
  }
});

function onPick(el) {
  if (S.view !== 'session') return;
  var q = S.cur.q;
  if (!q.material) return;
  var id = el.getAttribute('data-fid');
  if (S.cur.locked) return;
  var interactive = q.kind === 'locate';
  if (!interactive) {          // 计算题也允许点材料做辅助定位，只是不计分
    el.classList.toggle('sel');
    return;
  }
  var idx = S.cur.sel.indexOf(id);
  if (idx >= 0) S.cur.sel.splice(idx, 1);
  else {
    if (S.cur.sel.length >= q.multi) S.cur.sel.shift();
    S.cur.sel.push(id);
  }
  document.querySelectorAll('[data-fid]').forEach(function (x) {
    x.classList.toggle('sel', S.cur.sel.indexOf(x.getAttribute('data-fid')) >= 0);
  });
  buzz(5);
  updateSubmitState();
}

document.addEventListener('keydown', function (e) {
  if (S.view !== 'session') return;
  var q = S.cur.q;
  if (e.key >= '1' && e.key <= '4' && q.options) {
    var i = parseInt(e.key, 10) - 1;
    if (i < q.options.length && !S.cur.locked) {
      S.cur.chosen = i;
      document.querySelectorAll('.opt').forEach(function (el, j) { el.classList.toggle('sel', j === i); });
      updateSubmitState();
    }
    e.preventDefault();
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (S.cur.locked) nextQuestion();
    else submitAnswer(false);
  } else if (e.key === 'Escape') {
    S.view = 'home'; stopTimer(); render();
  }
});

/* ---------------- 启动 ---------------- */
applyTheme();
render();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
})();

</script>
